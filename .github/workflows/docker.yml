name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
   # run only on main **and** when the Docker Hub secrets exist
    if: github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USER != '' && secrets.DOCKERHUB_PASS != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Build & push scheduler image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/scheduler/Dockerfile
          push: true
          tags: yourdockerhubuser/cam-scheduler:latest

      - name: Build & push client image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/client/Dockerfile
          push: true
          tags: yourdockerhubuser/cam-client:latest
