name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  security:
    needs: build            # run only if tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bandit scan
        run: |
          pip install bandit
          bandit -r src -lll

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.15.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # —— OPTIONAL: publish Docker image only from main ——
  docker-push:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker login & push
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_PASS }}
        run: |
          echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin
          docker build -t "$DOCKERHUB_USER/cam:${{ github.sha }}" .
          docker push "$DOCKERHUB_USER/cam:${{ github.sha }}"
