
name: CAM Enterprise Edition

on:
  push:
    branches: [enterprise]
    paths:
      - 'deployment/ebpf/**'
      - 'security/fips/**'
      - 'analytics/**'
      - 'server/fastpath/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test:enterprise
      - run: npm run test:security

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build:enterprise
