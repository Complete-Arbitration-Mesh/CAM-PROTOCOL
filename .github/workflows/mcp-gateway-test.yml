name: MCP Gateway E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/mcp/**'
      - 'examples/mcp-gateway/**'
      - 'tests/mcp/**'
      - '.github/workflows/mcp-gateway-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/mcp/**'
      - 'examples/mcp-gateway/**'
      - 'tests/mcp/**'
      - '.github/workflows/mcp-gateway-test.yml'

env:
  NODE_VERSION: '20.x'

jobs:
  # Unit tests for MCP components
  mcp-unit-tests:
    name: MCP Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run MCP unit tests
        run: npm run test:mcp

  # E2E tests with real MCP servers (stdio transport)
  mcp-e2e-stdio:
    name: MCP E2E Tests (stdio)
    runs-on: ubuntu-latest
    needs: mcp-unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run MCP E2E tests
        run: npm run test:mcp:demo
        timeout-minutes: 5

      - name: Upload audit logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-audit-logs
          path: examples/mcp-gateway/audit.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Contract tests for MCP protocol compliance
  mcp-contract-tests:
    name: MCP Contract Tests
    runs-on: ubuntu-latest
    needs: mcp-unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run MCP contract tests
        run: npm run test -- --run tests/mcp-contract/

  # Docker compose smoke test
  mcp-docker-test:
    name: MCP Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [mcp-unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t cam-protocol:test .

      - name: Start services
        working-directory: examples/mcp-gateway
        run: |
          docker-compose up -d mcp-sse-server gateway jaeger
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check gateway health
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8080/health; then
              echo "Gateway is healthy!"
              exit 0
            fi
            echo "Waiting for gateway... ($i/10)"
            sleep 5
          done
          echo "Gateway failed to become healthy"
          docker-compose -f examples/mcp-gateway/docker-compose.yml logs gateway
          exit 1

      - name: Run smoke tests
        run: |
          # Test 1: List tools
          echo "Test 1: List available tools"
          TOOLS=$(curl -s http://localhost:8080/tools)
          echo "$TOOLS" | jq .

          # Test 2: Call search tool (should succeed)
          echo "Test 2: Call search tool"
          RESULT=$(curl -s -X POST http://localhost:8080/call \
            -H "Content-Type: application/json" \
            -H "X-Tenant-ID: test-tenant" \
            -d '{"toolName": "search", "arguments": {"query": "test"}}')
          echo "$RESULT" | jq .

          # Verify success
          SUCCESS=$(echo "$RESULT" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "ERROR: search tool call failed"
            exit 1
          fi

          # Test 3: Call admin tool (should be denied by policy)
          echo "Test 3: Call admin tool (should be denied)"
          RESULT=$(curl -s -X POST http://localhost:8080/call \
            -H "Content-Type: application/json" \
            -H "X-Tenant-ID: test-tenant" \
            -d '{"toolName": "admin_reset", "arguments": {"target": "test"}}')
          echo "$RESULT" | jq .

          # Verify denial
          SUCCESS=$(echo "$RESULT" | jq -r '.success')
          if [ "$SUCCESS" == "true" ]; then
            echo "ERROR: admin tool should have been denied by policy"
            exit 1
          fi

          # Test 4: Check audit log
          echo "Test 4: Verify audit log"
          AUDIT=$(curl -s http://localhost:8080/audit?limit=10)
          echo "$AUDIT" | jq .

          COUNT=$(echo "$AUDIT" | jq -r '.count')
          if [ "$COUNT" -lt "2" ]; then
            echo "ERROR: Expected at least 2 audit records"
            exit 1
          fi

          echo "All smoke tests passed!"

      - name: Show logs on failure
        if: failure()
        working-directory: examples/mcp-gateway
        run: docker-compose logs

      - name: Cleanup
        if: always()
        working-directory: examples/mcp-gateway
        run: docker-compose down -v
