name: Performance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-benchmark jq
      - name: Ramp test
        run: |
          ./scale_tests/scale_test.sh --duration 30s --format=json \
            > perf_output.json
      - name: Analyze results & gate
        run: |
          python scripts/analyze_results.py perf_output.json > perf_report.txt
          # fail if thresholds exceeded
          python scripts/check_performance.py perf_report.txt
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: perf_report.txt
