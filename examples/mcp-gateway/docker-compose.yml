version: '3.8'

services:
  # SSE MCP Server (HTTP transport)
  mcp-sse-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - SSE_PORT=3001
    command: ["npx", "tsx", "examples/mcp-gateway/servers/sse-server.ts"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # CAM MCP Gateway
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - CAM_LOG_LEVEL=info
      - CAM_OTEL_ENABLED=true
      - CAM_OTEL_EXPORTER_URL=http://jaeger:4318/v1/traces
      - SSE_SERVER_URL=http://mcp-sse-server:3001/sse
    depends_on:
      mcp-sse-server:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - ./audit:/app/audit
    command: ["npx", "tsx", "examples/mcp-gateway/gateway-server.ts"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

  # E2E Test Runner
  test-runner:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=test
      - GATEWAY_URL=http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    command: ["npx", "tsx", "examples/mcp-gateway/e2e-test.ts"]
    profiles:
      - test

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger
    profiles:
      - monitoring

networks:
  default:
    name: cam-mcp-network
