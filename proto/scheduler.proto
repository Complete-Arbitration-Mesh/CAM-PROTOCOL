syntax = "proto3";

package cam;

message Job {
  string id       = 1;
  int32  priority = 2;
  string payload  = 3;
}

message EnqueueRequest  { Job job = 1; }
message EnqueueReply    {}

message DequeueRequest  {}
message DequeueReply    { Job job = 1; }

message ReprioritiseRequest {
  string id          = 1;
  int32  newPriority = 2;
}
message ReprioritiseReply {}

service Scheduler {
  rpc Enqueue      (EnqueueRequest)      returns (EnqueueReply);
  rpc Dequeue      (DequeueRequest)      returns (DequeueReply);
  rpc Reprioritise (ReprioritiseRequest) returns (ReprioritiseReply);
}
